name: Monitor Metro e Trem SP

on:
  schedule:
    - cron: '*/30 8-23,0-3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Criar arquivo de credenciais do Google
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: echo "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Verificar credenciais
        run: |
          echo "Tamanho do arquivo:"
          wc -c credentials.json
          echo "Primeiros 50 chars:"
          head -c 50 credentials.json
          echo "É JSON válido?"
          python3 -c "import json; json.load(open('credentials.json')); print('SIM')" || echo "NÃO"

      - name: Rodar monitor de status
        run: python monitor.py

      - name: Gravar no Google Sheets (se houver alertas)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python sheets_writer.py

      - name: Salvar status.json no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Última execução: $(TZ='America/Sao_Paulo' date '+%d/%m/%Y %H:%M')" > data/ultima_execucao.txt
          git add data/
          git commit -m "chore: atualiza status $(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M BRT')"
          git push
